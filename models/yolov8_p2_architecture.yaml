# Ultralytics YOLOv8 P2-Head Architecture for Micro-Pest Detection (OAN Kenya)
# ==============================================================================
# Lead Architect: Nanda Kishore Kakulla <nandakishore.kakulla9@gmail.com>
#
# Adds a 4th detection head at Stride 4 (P2: 160x160 resolution for 640x640 input)
# Specifically designed for micro-arthropods (Aphids, Spider Mites, Thrips, Whiteflies)
# preventing sub-10px spatial feature loss caused by standard stride 8-16-32 downsampling.

# Parameters
nc: 28 # Number of classes (OAN Kenya 28-class agricultural taxonomy)
scales: # model compound scaling constants, [depth, width, max_channels]
  s: [0.33, 0.50, 1024] # Small: Optimized for mobile/edge CPU & edge NPU

# YOLOv8 backbone with P2-P5 pyramid
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2  (320x320)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 (160x160)
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 (80x80)
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 (40x40)
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 (20x20)
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8-P2 head (4 detection scales: P2, P3, P4, P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10 (40x40)
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13 (80x80)
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  # Branching to P2 (Stride 4, 160x160) for Micro-Pests
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16 (160x160)
  - [[-1, 2], 1, Concat, [1]] # 17 cat backbone P2
  - [-1, 3, C2f, [128]] # 18 (P2/4-micro)

  # Bottom-up path
  - [-1, 1, Conv, [128, 3, 2]] # 19 (80x80)
  - [[-1, 15], 1, Concat, [1]] # 20 cat head P3
  - [-1, 3, C2f, [256]] # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 22 (40x40)
  - [[-1, 12], 1, Concat, [1]] # 23 cat head P4
  - [-1, 3, C2f, [512]] # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 25 (20x20)
  - [[-1, 9], 1, Concat, [1]] # 26 cat head P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32-large)

  # 4 Detect Heads: P2 (160x160), P3 (80x80), P4 (40x40), P5 (20x20)
  - [[18, 21, 24, 27], 1, Detect, [nc]] # 28 Detect(P2, P3, P4, P5)
