version: '3.8'

services:
  benchmark-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oan-pest-lab
    environment:
      - OAN_DEVICE=cpu
      - OAN_ABSTENTION_THRESHOLD=0.40
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./models/weights:/app/models/weights
    ports:
      - "8000:8000"
    command: python scripts/benchmark.py --image data/golden/maize_fall_armyworm_01.jpg --models all
